<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drill Havuzu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface2:#E9EEE8; --line:#D6DDD4;
  --ink:#16201A; --ink2:#4E5B52; --ink3:#7C8880;
  --accent:#1D6B45; --accent-ink:#FFFFFF; --accent-soft:#DCEBE1;
  --cone:#E0661F; --cone-soft:#FBE6D8;
  --low:#2F8A57; --med:#C98A12; --high:#C63D2F;
  --warn-bg:#FCEFD9; --warn-ink:#8A5300;
  --pitch:#2E7D4F; --pitch-line:rgba(255,255,255,.75);
  --shadow:0 6px 24px rgba(20,40,28,.12);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101612; --surface:#18201B; --surface2:#212B24; --line:#2E3A32;
    --ink:#E8EEE9; --ink2:#AAB6AE; --ink3:#7D8A82;
    --accent:#4CB67F; --accent-ink:#0B130E; --accent-soft:#1F3A2A;
    --cone:#F08845; --cone-soft:#3A2518;
    --low:#56B87E; --med:#E0A93A; --high:#E86A5C;
    --warn-bg:#3A2C12; --warn-ink:#F2C46E;
    --pitch:#24583A; --pitch-line:rgba(255,255,255,.55);
    --shadow:0 6px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18201B; --surface2:#212B24; --line:#2E3A32;
  --ink:#E8EEE9; --ink2:#AAB6AE; --ink3:#7D8A82;
  --accent:#4CB67F; --accent-ink:#0B130E; --accent-soft:#1F3A2A;
  --cone:#F08845; --cone-soft:#3A2518;
  --low:#56B87E; --med:#E0A93A; --high:#E86A5C;
  --warn-bg:#3A2C12; --warn-ink:#F2C46E;
  --pitch:#24583A; --pitch-line:rgba(255,255,255,.55);
  --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand svg{flex:none}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab .cnt{font-size:12px;color:var(--ink3);margin-left:4px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--high)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* layout */
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100% - 60px)}
.side{border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);overflow:auto}
.side h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--ink3);margin:0 8px 8px}
.cat{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px;border-radius:8px;text-align:left;color:var(--ink2);font-weight:500}
.cat:hover{background:var(--surface2)}
.cat[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.cat .dot{width:10px;height:10px;border-radius:3px;flex:none}
.cat .n{margin-left:auto;font-size:12px;color:var(--ink3)}
main{padding:18px 16px 60px;min-width:0}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 12px}
.search input{border:0;background:transparent;padding:9px 0;flex:1;outline:none;min-width:0}
select.f{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;max-width:100%}
.hd{display:flex;align-items:baseline;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.hd h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hd .sub{color:var(--ink3)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.thumb{aspect-ratio:16/9;background:var(--pitch);position:relative;overflow:hidden;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.thumb .dims{position:absolute;right:8px;bottom:6px;color:#fff;font-family:var(--display);font-size:14px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.cbody{padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.ctitle{font-weight:600;font-size:16px;line-height:1.25}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--surface2);color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.chip .dot{width:7px;height:7px;border-radius:2px}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink2);font-size:13px}
.meta b{color:var(--ink);font-weight:600}
.cfoot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:4px}
.int{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.int.low{color:var(--low)} .int.med{color:var(--med)} .int.high{color:var(--high)}
.ico{border:0;background:transparent;padding:5px 7px;border-radius:7px;display:inline-flex;align-items:center;gap:4px;color:var(--ink3);font-size:13px;font-weight:600}
.ico:hover{background:var(--surface2);color:var(--ink)}
.ico.on.star{color:var(--cone)}
.ico.on.like{color:var(--accent)}
.ico svg{width:18px;height:18px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--ink3)}
.banner{background:var(--warn-bg);color:var(--warn-ink);padding:10px 14px;border-radius:9px;margin-bottom:14px;font-size:14px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,10,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:760px;box-shadow:var(--shadow);overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{font-family:var(--display);font-size:24px;margin:0;text-transform:uppercase;flex:1;line-height:1.1}
.mbody{padding:18px;display:flex;flex-direction:column;gap:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:transparent;font-size:24px;line-height:1;color:var(--ink3);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface2)}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.s2{grid-column:span 2} .fld.s4{grid-column:1/-1}
.fld label,.lbl{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.fld input:not([type=checkbox]):not([type=radio]),.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.hint{font-size:12px;color:var(--ink3)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.fld .catpick input{margin:0;accent-color:var(--accent);width:auto;padding:0}
.catpick .dot{flex:none}
.srcrow .src{font-size:11px;font-weight:700;color:#fff;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:7px 4px;font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink2);font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--ink)}
.seg label:has(input:checked){background:var(--surface2);color:var(--ink)}
.media{display:flex;gap:8px;flex-wrap:wrap}
.mitem{position:relative;width:120px;height:80px;border-radius:8px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);padding:4px;text-align:center;word-break:break-all}
.mitem img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mitem .rm{position:absolute;z-index:3;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:5px;width:22px;height:22px;line-height:20px;padding:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:10px 12px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600}
.stat .v{font-family:var(--display);font-size:22px;font-weight:600}
.dsec h5{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.dsec p{margin:0;white-space:pre-wrap}
.hero{border-radius:10px;overflow:hidden;background:var(--pitch);max-width:100%}
.hero img{display:block;width:100%;max-height:420px;object-fit:contain;background:#0d1a12}
.gal{display:flex;gap:6px;flex-wrap:wrap}
.gal button{border:2px solid transparent;padding:0;border-radius:7px;overflow:hidden;width:72px;height:48px;background:var(--surface2)}
.gal button[aria-current="true"]{border-color:var(--accent)}
.gal img{width:100%;height:100%;object-fit:cover}
.vlist{display:flex;flex-direction:column;gap:6px}
.vlink{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-decoration:none;color:var(--ink);background:var(--bg)}
.vlink:hover{border-color:var(--ink3)}
.vlink .src{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:3px 7px;border-radius:5px;flex:none}
.vlink .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.vlink .go{color:var(--ink3);font-size:13px;flex:none}
.vid{border-radius:10px;overflow:hidden;background:#000;max-width:100%}
.vid video{display:block;width:100%;max-height:420px}
.mitem .src{font-size:10px;font-weight:700;text-transform:uppercase;color:#fff;padding:2px 6px;border-radius:4px;margin-bottom:4px}
.mitem{flex-direction:column;width:160px;height:100px}
.mitem .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11px;font-weight:600;padding:12px 6px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
.mitem .src{position:absolute;left:5px;top:5px;z-index:2;margin:0}
.mitem video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--vc,#2a2f2c)}
.vt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px)}
.vt img,.vt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;pointer-events:none}
.play::after{content:"";margin-left:4px;border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent #fff}
.thumb .play{width:52px;height:52px}
.thumb .play::after{border-width:10px 0 10px 16px}
.thumb .vt{z-index:0}
.vlink .vthumb{position:relative;width:96px;height:56px;border-radius:6px;overflow:hidden;flex:none}
.vlink .vthumb .play{width:28px;height:28px;border-width:1.5px}
.vlink .vthumb .play::after{border-width:6px 0 6px 9px;margin-left:3px}
.linkrow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-top:6px}
.linkrow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;min-width:0}
.srcrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
@media (max-width:560px){.linkrow{grid-template-columns:1fr}}

/* plan */
.weekbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.weeknav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.weeknav button{border:0;background:transparent;padding:6px 10px;border-radius:6px;font-weight:700}
.weeknav button:hover{background:var(--surface2)}
.weeknav .w{font-weight:600;padding:0 8px;white-space:nowrap}
.planwrap{display:grid;grid-template-columns:1fr 280px;gap:14px;align-items:start}
.days{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;min-height:320px;min-width:0}
.day.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.day.match{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day.off{background:var(--surface2)}
.dhead{padding:9px 10px 7px;border-bottom:1px solid var(--line)}
.dlabel{display:flex;align-items:center;gap:6px}
.dlabel .md{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;white-space:nowrap}
.picker .search{flex:none}
.dlabel select{margin-left:auto;width:52px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12px;padding:2px 4px}
.ddate{font-size:12px;color:var(--ink3)}
.dload{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--ink2)}
.bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.ditems{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.pitem{border:1px solid var(--line);border-left:4px solid var(--c,var(--ink3));border-radius:7px;padding:6px 7px;background:var(--bg);font-size:13px}
.pitem .t{font-weight:600;line-height:1.2;cursor:pointer}
.pitem .r{display:flex;align-items:center;gap:4px;margin-top:4px}
.pitem input{width:46px;border:1px solid var(--line);border-radius:5px;padding:1px 4px;background:var(--surface);font-size:12px}
.pitem .r .sp{flex:1}
.mini{border:0;background:transparent;color:var(--ink3);padding:1px 4px;border-radius:4px;font-size:13px}
.mini:hover{background:var(--surface2);color:var(--ink)}
.dwarn{margin:0 8px 8px;background:var(--warn-bg);color:var(--warn-ink);font-size:12px;padding:6px 8px;border-radius:6px}
.dempty{color:var(--ink3);font-size:12px;text-align:center;padding:14px 4px;border:1px dashed var(--line);border-radius:7px}
.picker{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px;position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column;gap:8px}
.picker h4{margin:0;font-family:var(--display);text-transform:uppercase;font-size:16px}
.plist{overflow:auto;display:flex;flex-direction:column;gap:5px;flex:1}
.pdrill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:7px;padding:6px 6px 6px 8px;font-size:13px;background:var(--bg);cursor:grab}
.pdrill .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pdrill select{border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12px;padding:2px;max-width:76px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:10px}

.use{font-size:12px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.use .u{padding:1px 6px;border-radius:4px;background:var(--surface2);color:var(--ink2);font-weight:600}
.use .u.never{background:var(--cone-soft);color:var(--cone)}
.use .u.next{background:var(--accent-soft);color:var(--accent)}
.hist{display:flex;flex-wrap:wrap;gap:5px}
.hist span{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:2px 7px;background:var(--bg)}
.hist span b{font-family:var(--display);font-size:14px;margin-right:4px}
.btn.ai{background:var(--surface);border-color:var(--accent);color:var(--accent)}
.aibox{display:flex;flex-direction:column;gap:10px}
.aibox textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;min-height:74px;resize:vertical;width:100%}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.qchips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink2)}
.qchips button:hover{border-color:var(--accent);color:var(--ink)}
.thread{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow:auto}
.msg-u{align-self:flex-end;background:var(--accent-soft);border-radius:10px 10px 2px 10px;padding:8px 12px;max-width:85%;white-space:pre-wrap}
.msg-a{display:flex;flex-direction:column;gap:8px}
.msg-a p{margin:0;white-space:pre-wrap;line-height:1.5}
.pick{border:1px solid var(--line);border-left:4px solid var(--c,var(--ink3));border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.pick .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick .nm{font-weight:600;flex:1;min-width:140px}
.pick .why{font-size:13px;color:var(--ink2)}
.pick select{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:12px;padding:3px}
.draft{border:1px dashed var(--accent);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:6px}
.draft .nm{font-weight:700}
.thinking{color:var(--ink3);font-size:14px;display:flex;align-items:center;gap:8px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none}}
.forgot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.forgot .fh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}

function imgUrl(id){return S.mode==='supa'?SUPA.url+'/storage/v1/object/public/'+SUPA.bucket+'/'+id:S.local?(BLOBURL.get(id)||''):'/_blob/'+id;}
const SOURCES=[

function labelIn(w,i){const d=w.days&&w.days[i];if(d&&d.label)return d.label;const r=i-(w.matchIdx==null?6:w.matchIdx);return r===0?'MD':(r>0?'MD+'+r:'MD'+r);}
function usage(){
  const all=new Map(S.weeks);if(S.weekDoc)all.set(iso(S.week),S.weekDoc);
  const today=iso(new Date());const U={};
  all.forEach((w,wid)=>{const st=new Date(wid+'T00:00:00');if(isNaN(st))return;
    for(let i=0;i<7;i++){const items=(w.days&&w.days[i]&&w.days[i].items)||[];if(!items.length)continue;const ds=iso(addDays(st,i));const lab=labelIn(w,i);
      items.forEach(it=>{const u=U[it.drill]||(U[it.drill]={past:[],next:null});
        if(ds<=today)u.past.push({d:ds,l:lab});else if(!u.next||ds<u.next.d)u.next={d:ds,l:lab};});}

const FORGOT_DAYS=21,NEW_GRACE=3;

function forgotten(){
  const U=S._u||usage();const z=snoozes();const now=Date.now();
  return drillList().filter(d=>{

    const u=U[d.id];if(u&&u.next)return false;

  }).map(d=>{const u=U[d.id];const last=u&&u.past.length?u.past[0].d:null;

function fmtIso(s){const d=new Date(s+'T00:00:00');return fmtD(d);}

 star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17.1l-5.7 3.1 1.2-6.3L2.8 9.5l6.4-.8z"/></svg>',

/* grab a still frame from an uploaded video to use as its poster */
function posterFrom(file){
  return new Promise(res=>{
    const v=document.createElement('video');const u=URL.createObjectURL(file);let done=false;
    const fin=b=>{if(done)return;done=true;URL.revokeObjectURL(u);res(b);};
    v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;
    v.onloadedmetadata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/3);}catch(e){fin(null);}};
    v.onseeked=()=>{try{const w=Math.min(960,v.videoWidth||640),h=Math.round(w*(v.videoHeight||360)/(v.videoWidth||640));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);c.toBlob(b=>fin(b),'image/jpeg',.82);}catch(e){fin(null);}};
    v.onerror=()=>fin(null);setTimeout(()=>fin(null),8000);
  });
}

  if(S.fPlayers){l=l.filter(d=>{const p=+d.playerCount||0;return S.fPlayers==='s'?p&&p<=8:S.fPlayers==='m'?p>=9&&p<=14:p>=15;});}
  if(S.fDur){l=l.filter(d=>{const m=+d.dur||0;return S.fDur==='s'?m&&m<=10:S.fDur==='m'?m>10&&m<=20:m>20;});}
  if(q)l=l.filter(d=>[d.name,d.goal,d.desc,d.notes,d.players,(d.tags||[]).join(' '),(d.cats||[]).map(k=>CAT[k]?CAT[k].n:'').join(' ')].join(' ').toLocaleLowerCase('tr').includes(q));
  if(S.view==='forgot'&&S.sort==='new'){const ord=forgotten().map(d=>d.id);l.sort((a,b)=>ord.indexOf(a.id)-ord.indexOf(b.id));return l;}
  const U=S._u||{};
  const lastOf=d=>{const u=U[d.id];return u&&u.past.length?u.past[0].d:'';};
  const cntOf=d=>{const u=U[d.id];return u?u.past.length:0;};
  if(S.sort==='new')l.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  else if(S.sort==='stale')l.sort((a,b)=>lastOf(a)<lastOf(b)?-1:lastOf(a)>lastOf(b)?1:0);
  else if(S.sort==='most')l.sort((a,b)=>cntOf(b)-cntOf(a)||(lastOf(a)<lastOf(b)?1:-1));
  else if(S.sort==='liked')l.sort((a,b)=>countTrue(b.likes)-countTrue(a.likes)||(b.createdAt||0)-(a.createdAt||0));
  else l.sort((a,b)=>String(a.name).localeCompare(String(b.name),'tr'));
  return l;
}

$('#main').addEventListener('click',e=>{
  if(S.view==='plan'){planClick(e);return;}
  const ft=e.target.closest('[data-fsnooze]');
  if(ft){
    if(ft.dataset.fstar){toggleMark(ft.dataset.fstar,'stars');return;}
    if(ft.dataset.flike){toggleMark(ft.dataset.flike,'likes');toast('Beğenildi');return;}
    if(ft.dataset.fsnooze){e.stopPropagation();snooze(ft.dataset.fsnooze);renderSide();renderPool();toast('14 gün boyunca önerilmeyecek');return;}
    if(ft.dataset.fopen){openDetail(ft.dataset.fopen);return;}
  }
  const card=e.target.closest('.card');if(!card)return;
  const act=e.target.closest('[data-act]');
  if(act){e.stopPropagation();toggleMark(card.dataset.id,act.dataset.act==='star'?'stars':'likes');return;}
  openDetail(card.dataset.id);
});
$('#main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))openDetail(e.target.dataset.id);});

async function toggleMark(id,field){
  const d=S.drills.get(id);if(!d)return;
  const on=!mySet(d[field]);
  const patch={};patch[field]={};patch[field][S.uid]=on;
  const nd=Object.assign({},d);nd[field]=Object.assign({},d[field]||{});nd[field][S.uid]=on;S.drills.set(id,nd);render();
  if(S.db){try{await S.db.doc('drills/'+id).update(patch);}catch(err){toast('Kaydedilemedi: '+(err.code||''));}}
  if(field==='stars')toast(on?'Favorilere eklendi':'Favorilerden çıkarıldı');
}

/* downscale large photos before upload */
function shrink(file){
  return new Promise(res=>{
    if(file.type==='image/gif'||file.size<700000){res(file);return;}
    const img=new Image();const u=URL.createObjectURL(file);
    img.onload=()=>{const max=1800;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
      c.toBlob(b=>res(b||file),'image/jpeg',.86);};
    img.onerror=()=>{URL.revokeObjectURL(u);res(file);};img.src=u;
  });
}

async function askAI(){
  const q=$('#aiQ').value.trim();if(!q||S.aiBusy||!S.sample)return;
  $('#aiQ').value='';
  const first=!S.aiTurns.length;
  const content=first?AI_RULES+'\n\nVERİ (JSON):\n'+JSON.stringify(aiContext())+'\n\nKULLANICI İSTEĞİ:\n'+q
    :'Güncel haftalık plan: '+JSON.stringify(aiContext().haftalik_plan)+'\n\nKULLANICI İSTEĞİ:\n'+q+'\n\n(Yanıtı yine aynı JSON biçiminde ver.)';
  S.aiTurns.push({role:'user',content,show:q});S.aiBusy=true;renderThread();
  S.aiCtl=new AbortController();
  try{
    const msgs=S.aiTurns.map(m=>({role:m.role,content:m.content}));
    const r=await S.sample.json(msgs,{signal:S.aiCtl.signal,cache:false,modelTier:'default'});
    const parsed=(r&&typeof r==='object')?r:{answer:String(r)};
    S.aiTurns.push({role:'assistant',content:JSON.stringify(parsed),parsed});
  }catch(err){
    S.aiTurns.pop();
    if(err&&err.code==='cancelled'){}
    else if(err&&err.code==='invalid_json'&&err.text){S.aiTurns.push({role:'user',content,show:q});S.aiTurns.push({role:'assistant',content:err.text,parsed:{answer:err.text}});}
    else if(err&&err.code==='not_granted'){toast('Asistan için izin verilmedi');$('#aiBtn').hidden=true;}
    else if(err&&err.code==='rate_limited')toast('Çok sık soruldu, biraz sonra tekrar dene');
    else toast('Asistan yanıt veremedi'+(err&&err.code?': '+err.code:''));
  }
  S.aiBusy=false;S.aiCtl=null;renderThread();
}

function emptyWeek(){const days={};for(let i=0;i<7;i++)days[i]={items:[],label:''};return {start:iso(S.week),matchIdx:6,opponent:'',days};}
function wk(){return S.weekDoc||emptyWeek();}
function dayLabel(i){const w=wk();const d=w.days&&w.days[i];if(d&&d.label)return d.label;const r=i-(w.matchIdx==null?6:w.matchIdx);return r===0?'MD':(r>0?'MD+'+r:'MD'+r);}
let wchain=Promise.resolve();
function weekWrite(mut){
  const w=JSON.parse(JSON.stringify(wk()));const patch=mut(w);S.weekDoc=w;renderPlan();
  if(!S.db)return;
  const ref=S.db.doc('weeks/'+iso(S.week));
  wchain=wchain.then(async()=>{
    try{if(!S.weekExists){await ref.set(w);S.weekExists=true;}else await ref.update(patch);}
    catch(err){toast('Plan kaydedilemedi: '+(err.code||''));}
  });
}
function subWeek(){
  if(S.weekUnsub){S.weekUnsub();S.weekUnsub=null;}
  S.weekDoc=null;S.weekExists=false;
  if(!S.db){renderPlan();return;}
  S.weekUnsub=S.db.doc('weeks/'+iso(S.week)).onSnapshot(s=>{S.weekExists=s.exists;S.weekDoc=s.exists?JSON.parse(JSON.stringify(s.data())):null;if(S.view==='plan')renderPlan();},()=>{});
}
function addToDay(i,drillId){
  const d=S.drills.get(drillId);
  weekWrite(w=>{const day=w.days[i]||(w.days[i]={items:[],label:''});day.items=day.items||[];day.items.push({k:Math.random().toString(36).slice(2,9),drill:drillId,dur:d&&d.dur?+d.dur:10});return {days:{[i]:{items:day.items}}};});
}
function dayWarn(i,items){
  const lab=dayLabel(i);const hi=items.filter(it=>{const d=S.drills.get(it.drill);return d&&d.intensity==='high';});
  if(lab==='OFF'&&items.length)return 'Bu gün izin olarak işaretli ama drill var.';
  if(!hi.length)return '';
  if(lab==='MD-1')return 'MD-1\'de yüksek yoğunluklu drill var: aktivasyon ve hız dışı yüklemeden kaçın.';
  if(lab==='MD+1')return 'MD+1 toparlanma günü; yüksek yoğunluk sadece oynamayanlar için düşünülmeli.';
  if(lab==='MD')return 'Maç günü planında yüksek yoğunluklu drill var.';
  return '';
}

/* ---------- local (offline) mode: IndexedDB-backed stand-ins ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('drill-havuzu',1);r.onupgradeneeded=()=>{r.result.createObjectStore('docs');r.result.createObjectStore('blobs');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(dbh,store,mode,fn){return new Promise((res,rej)=>{const t=dbh.transaction(store,mode);const st=t.objectStore(store);const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);});}
function allOf(dbh,store){return new Promise((res,rej)=>{const t=dbh.transaction(store,'readonly');const st=t.objectStore(store);const ks=st.getAllKeys(),vs=st.getAll();t.oncomplete=()=>res(ks.result.map((k,i)=>[k,vs.result[i]]));t.onerror=()=>rej(t.error);});}
function rid(){return Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(16).padStart(2,'0')).join('');}
function deepMerge(a,b){const o=Object.assign({},a);for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?deepMerge(o[k],v):v;}return o;}
async function makeLocal(){
  const h=await idb();
  const docs=new Map(await allOf(h,'docs'));
  for(const [id,blob] of await allOf(h,'blobs'))BLOBURL.set(id,URL.createObjectURL(blob));
  const subs=[];
  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const snapDoc=(path)=>{const v=docs.get(path);return {id:path.split('/').pop(),exists:v!==undefined,data:()=>clone(v),metadata:{fromCache:false,hasPendingWrites:false}};};
  const snapCol=(col)=>{const ds=[...docs.keys()].filter(k=>k.startsWith(col+'/')&&k.split('/').length===col.split('/').length+1).sort().map(snapDoc);return {docs:ds,size:ds.length,empty:!ds.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};};
  const notify=()=>subs.forEach(s=>{try{s.col?s.fn(snapCol(s.col)):s.fn(snapDoc(s.path));}catch(e){console.error(e);}});
  const put=async(path,v)=>{if(v===undefined){docs.delete(path);await tx(h,'docs','readwrite',st=>st.delete(path));}else{docs.set(path,clone(v));await tx(h,'docs','readwrite',st=>st.put(clone(v),path));}setTimeout(notify,0);};
  const docRef=path=>({id:path.split('/').pop(),path,
    get:async()=>snapDoc(path),
    set:async d=>put(path,d),
    update:async d=>{if(!docs.has(path))throw {code:'invalid_argument',message:'missing'};await put(path,deepMerge(docs.get(path),d));},
    delete:async()=>put(path,undefined),
    onSnapshot:(fn)=>{const s={path,fn};subs.push(s);setTimeout(()=>fn(snapDoc(path)),0);return ()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};}});
  const db={doc:docRef,collection:col=>({path:col,doc:id=>docRef(col+'/'+(id||rid())),add:async d=>{const r=docRef(col+'/'+rid());await r.set(d);return r;},
    onSnapshot:(fn)=>{const s={col,fn};subs.push(s);setTimeout(()=>fn(snapCol(col)),0);return ()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};}})};
  const assets={upload:async(blob,opt)=>{const id=rid()+rid().slice(0,12);const b=opt&&opt.type&&blob.type!==opt.type?new Blob([blob],{type:opt.type}):blob;await tx(h,'blobs','readwrite',st=>st.put(b,id));const url=URL.createObjectURL(b);BLOBURL.set(id,url);return {id,url,sizeBytes:b.size,contentType:b.type};},
    delete:async id=>{await tx(h,'blobs','readwrite',st=>st.delete(id));BLOBURL.delete(id);return {deleted:true};},list:async()=>({assets:[],usage:{}})};
  const downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);return {status:'saved'};}};
  const backup={
    export:async()=>{const out={app:'drill-havuzu',v:1,at:new Date().toISOString(),docs:Object.fromEntries(docs),blobs:{}};
      for(const [id,blob] of await allOf(h,'blobs')){out.blobs[id]={type:blob.type,b64:await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(blob);})};}
      await downloads.save({filename:'drill-havuzu-yedek-'+iso(new Date())+'.json',data:new Blob([JSON.stringify(out)],{type:'application/json'})});},
    import:async(file)=>{const j=JSON.parse(await file.text());if(!j||j.app!=='drill-havuzu')throw new Error('Bu dosya bir Drill Havuzu yedeği değil');
      for(const [id,b] of Object.entries(j.blobs||{})){const bin=atob(b.b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const blob=new Blob([u],{type:b.type});await tx(h,'blobs','readwrite',st=>st.put(blob,id));BLOBURL.set(id,URL.createObjectURL(blob));}
      for(const [path,v] of Object.entries(j.docs||{})){docs.set(path,v);await tx(h,'docs','readwrite',st=>st.put(v,path));}
      notify();return Object.keys(j.docs||{}).filter(k=>k.startsWith('drills/')).length;}
  };
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  return {db,assets,downloads,backup};
}

/* ---------- team mode: Supabase-backed store ---------- */
async function makeSupa(sb,user){
  const cache=new Map();const loaded=new Map();const subs=[];
  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const colOf=p=>p.split('/').slice(0,-1).join('/');
  const snapDoc=path=>{const v=cache.get(path);return {id:path.split('/').pop(),exists:v!==undefined,data:()=>clone(v),metadata:{fromCache:false,hasPendingWrites:false}};};
  const snapCol=col=>{const ds=[...cache.keys()].filter(k=>colOf(k)===col).sort().map(snapDoc);return {docs:ds,size:ds.length,empty:!ds.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};};
  let nt=null;const notify=()=>{clearTimeout(nt);nt=setTimeout(()=>subs.forEach(s=>{try{s.col!=null?s.fn(snapCol(s.col)):s.fn(snapDoc(s.path));}catch(e){console.error(e);}}),30);};
  const err=(e)=>({code:(e&&e.code==='P0002')?'invalid_argument':'unavailable',message:(e&&e.message)||String(e)});
  function loadCol(col){
    if(!loaded.has(col))loaded.set(col,(async()=>{
      let from=0;const page=1000;
      for(;;){const {data,error}=await sb.from('dh_docs').select('path,data').eq('col',col).range(from,from+page-1);if(error)throw err(error);
        data.forEach(r=>cache.set(r.path,r.data));if(data.length<page)break;from+=page;}
    })());
    return loaded.get(col);
  }
  sb.channel('dh_docs').on('postgres_changes',{event:'*',schema:'public',table:'dh_docs'},pl=>{
    if(pl.eventType==='DELETE'){const p=pl.old&&pl.old.path;if(p){cache.delete(p);notify();}}
    else if(pl.new&&pl.new.path){cache.set(pl.new.path,pl.new.data);notify();}
  }).subscribe();
  /* refresh when the window regains focus, in case a realtime message was missed */
  window.addEventListener('focus',async()=>{for(const col of loaded.keys()){try{const {data}=await sb.from('dh_docs').select('path,data').eq('col',col);if(data){[...cache.keys()].filter(k=>colOf(k)===col).forEach(k=>cache.delete(k));data.forEach(r=>cache.set(r.path,r.data));}}catch(e){}}notify();});
  const docRef=path=>({id:path.split('/').pop(),path,
    get:async()=>{const {data,error}=await sb.from('dh_docs').select('data').eq('path',path).maybeSingle();if(error)throw err(error);if(data)cache.set(path,data.data);else cache.delete(path);return snapDoc(path);},
    set:async d=>{const v=clone(d);cache.set(path,v);notify();const {error}=await sb.from('dh_docs').upsert({path,col:colOf(path),data:v,updated_at:new Date().toISOString(),updated_by:user.id});if(error)throw err(error);},
    update:async patch=>{if(cache.has(path)){cache.set(path,deepMerge(cache.get(path),clone(patch)));notify();}
      const {data,error}=await sb.rpc('dh_update',{p_path:path,p_patch:patch});if(error)throw err(error);if(data){cache.set(path,data);notify();}},
    delete:async()=>{cache.delete(path);notify();const {error}=await sb.from('dh_docs').delete().eq('path',path);if(error)throw err(error);},
    onSnapshot:(fn,onErr)=>{const s={path,fn};subs.push(s);loadCol(colOf(path)).then(()=>fn(snapDoc(path)),e=>onErr&&onErr(e));return ()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};}});
  const db={doc:docRef,collection:col=>({path:col,doc:id=>docRef(col+'/'+(id||rid())),add:async d=>{const r=docRef(col+'/'+rid());await r.set(d);return r;},
    onSnapshot:(fn,onErr)=>{const s={col,fn};subs.push(s);loadCol(col).then(()=>fn(snapCol(col)),e=>onErr&&onErr(e));return ()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};}})};
  const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','video/mp4':'mp4','video/webm':'webm'};
  const assets={
    upload:async(blob,opt)=>{const type=(opt&&opt.type)||blob.type||'application/octet-stream';const id=new Date().toISOString().slice(0,7)+'/'+rid()+'.'+(EXT[type]||'bin');
      const {error}=await sb.storage.from(SUPA.bucket).upload(id,blob,{contentType:type,upsert:false,cacheControl:'31536000'});
      if(error)throw {code:/exceed|too large|size/i.test(error.message||'')?'too_large':'upstream_error',message:error.message};
      return {id,url:imgUrl(id),sizeBytes:blob.size,contentType:type};},
    delete:async id=>{const {error}=await sb.storage.from(SUPA.bucket).remove([id]);if(error)throw {code:'upstream_error',message:error.message};return {deleted:true};},
    list:async()=>({assets:[],usage:{}})};
  const downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);return {status:'saved'};}};
  return {db,assets,downloads};
}

    '<div class="err" id="lgErr" hidden></div><button class="btn primary" id="lgBtn" style="justify-content:center">Giriş yap</button></form>'+
    '<p class="hint">Hesabın yoksa ya da şifreni unuttuysan yöneticiye yaz; Ekip ekranından hesap açar veya şifreni sıfırlar.</p>');
  $('#lg').onsubmit=async e=>{e.preventDefault();const b=$('#lgBtn');b.disabled=true;$('#lgErr').hidden=true;
    const {error}=await sb.auth.signInWithPassword({email:toEmail($('#lgE').value),password:$('#lgP').value});
    if(error){$('#lgErr').textContent=trErr(error.message);$('#lgErr').hidden=false;b.disabled=false;}
  };
  setTimeout(()=>$('#lgE')&&$('#lgE').focus(),30);
}
function openPw(sb){
  openModal('<div class="mhead"><h2>Şifre değiştir</h2><button class="x" id="mx" aria-label="Kapat">×</button></div><form class="mbody" id="pwF"><div class="fld"><label for="pw1">Yeni şifre</label><input id="pw1" type="password" autocomplete="new-password" minlength="6" required></div><div class="fld"><label for="pw2">Yeni şifre (tekrar)</label><input id="pw2" type="password" autocomplete="new-password" minlength="6" required></div><div style="display:flex;justify-content:flex-end"><button class="btn primary">Kaydet</button></div></form>');
  $('#mx').onclick=closeModal;
  $('#pwF').onsubmit=async e=>{e.preventDefault();if($('#pw1').value!==$('#pw2').value){toast('Şifreler aynı değil');return;}if($('#pw1').value.length<6){toast('Şifre en az 6 karakter olmalı');return;}
    const {error}=await sb.auth.updateUser({password:$('#pw1').value});if(error)toast(trErr(error.message));else{closeModal();toast('Şifren değişti');}};
}
async function openTeam(sb){
  openModal('<div class="mhead"><h2>Ekip</h2><button class="x" id="mx" aria-label="Kapat">×</button></div><div class="mbody">'+
   '<p style="margin:0">Her antrenör için bir kullanıcı adı ve ilk şifre belirle, bunları ona ilet. Giriş yaptıktan sonra kendi şifresini “Şifre” butonundan değiştirebilir.</p>'+
   '<form id="tmF" style="display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px"><input id="tmU" placeholder="Kullanıcı adı (örn. ahmet)" autocapitalize="none" spellcheck="false" required style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0"><input id="tmP" placeholder="İlk şifre (en az 6)" required minlength="6" style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0"><select id="tmR" class="f"><option value="coach">Antrenör</option><option value="admin">Yönetici</option></select><button class="btn primary">Ekle</button></form>'+
   '<p class="hint" style="margin:0">Kullanıcı adında Türkçe karakter ve boşluk kullanma (ş→s, ı→i gibi).</p>'+
   '<div id="tmL"><p class="hint">Yükleniyor…</p></div></div>');
  $('#mx').onclick=closeModal;
  $('#tmP').value=Math.random().toString(36).slice(2,8);
  const load=async()=>{const {data,error}=await sb.from('dh_members').select('email,username,role,added_at').order('added_at');
    if(error){$('#tmL').innerHTML='<p class="hint">Liste alınamadı.</p>';return;}
    $('#tmL').innerHTML=data.map(m=>'<div class="mrow"><span class="em"><b>'+esc(m.username||uname(m.email))+'</b></span><span class="role '+m.role+'">'+(m.role==='admin'?'Yönetici':'Antrenör')+'</span>'+
      (m.email!==S.email?'<button class="mini" data-pwm="'+esc(m.username||uname(m.email))+'" data-role="'+m.role+'">Şifre sıfırla</button><button class="mini" data-rmm="'+esc(m.email)+'">Çıkar</button>':'<span class="hint">sen</span>')+'</div>').join('');
    document.querySelectorAll('[data-rmm]').forEach(b=>b.onclick=async()=>{const who=uname(b.dataset.rmm);if(!(await confirmBox(who+' ekipten çıkarılacak ve hesabı silinecek. Eklediği drill\'ler havuzda kalır.','Çıkar'))){openTeam(sb);return;}
      const {error}=await sb.rpc('dh_remove_member',{p_email:b.dataset.rmm});toast(error?trErr(error.message):who+' çıkarıldı');openTeam(sb);});
    document.querySelectorAll('[data-pwm]').forEach(b=>b.onclick=()=>{const u=b.dataset.pwm;const np=Math.random().toString(36).slice(2,8);
      openModal('<div class="mhead"><h2>Şifre sıfırla</h2><button class="x" id="mx2" aria-label="Kapat">×</button></div><form class="mbody" id="rpF"><p style="margin:0"><b>'+esc(u)+'</b> için yeni şifre:</p><input id="rpP" value="'+np+'" minlength="6" required style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px"><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="rpC">Vazgeç</button><button class="btn primary">Kaydet</button></div></form>');
      $('#mx2').onclick=()=>openTeam(sb);$('#rpC').onclick=()=>openTeam(sb);
      $('#rpF').onsubmit=async e=>{e.preventDefault();const pw=$('#rpP').value;const {error}=await sb.rpc('dh_upsert_member',{p_username:u,p_password:pw,p_role:b.dataset.role});
        if(error)toast(trErr(error.message));else{openTeam(sb);toast(u+' için yeni şifre: '+pw);}};});};
  $('#tmF').onsubmit=async e=>{e.preventDefault();const u=$('#tmU').value.trim().toLowerCase(),pw=$('#tmP').value;
    const {error}=await sb.rpc('dh_upsert_member',{p_username:u,p_password:pw,p_role:$('#tmR').value});
    if(error)toast(trErr(error.message));else{openModal('<div class="mhead"><h2>Hesap hazır</h2></div><div class="mbody"><p style="margin:0">Bu bilgileri antrenöre ilet:</p><div class="stats num"><div class="stat"><div class="k">Kullanıcı adı</div><div class="v">'+esc(u)+'</div></div><div class="stat"><div class="k">Şifre</div><div class="v">'+esc(pw)+'</div></div></div><p class="hint" style="margin:0">Giriş yaptıktan sonra şifresini değiştirebilir.</p></div><div class="mfoot"><button class="btn primary" id="okT">Tamam</button></div>');$('#okT').onclick=()=>openTeam(sb);}};
  load();
}
async function startSupa(){
  const sb=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'dh-auth'}});
  S.sb=sb;
  const {data:{session}}=await sb.auth.getSession();
  const had=!!session;
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='SIGNED_IN'&&!had)location.reload();if(ev==='SIGNED_OUT')location.reload();});
  if(!session){loginScreen(sb);return null;}
  const u=session.user;S.email=(u.email||'').toLowerCase();
  const [{data:isMem},{data:isAdm}]=await Promise.all([sb.rpc('dh_is_member'),sb.rpc('dh_is_admin')]);
  if(!isMem){gate('<h1>'+LOGO+'Drill Havuzu</h1><p><b>'+esc(uname(S.email))+'</b> ekip listesinde değil. Yöneticiden seni “Ekip” ekranından eklemesini iste, sonra sayfayı yenile.</p><div style="display:flex;gap:8px"><button class="btn primary" onclick="location.reload()">Yenile</button><button class="btn" id="gOut">Çıkış</button></div>');$('#gOut').onclick=()=>sb.auth.signOut();return null;}
  S.started=true;
  $('#who').textContent=uname(S.email);$('#pwBtn').hidden=false;$('#pwBtn').onclick=()=>openPw(sb);$('#who').hidden=false;$('#outBtn').hidden=false;$('#outBtn').onclick=()=>sb.auth.signOut();
  if(isAdm){$('#teamBtn').hidden=false;$('#teamBtn').onclick=()=>openTeam(sb);}
  const L=await makeSupa(sb,u);return Object.assign(L,{uid:u.id});
}

render();
(async function boot(){
  const cl=window.claude;
  const use=n=>cl&&cl.use?cl.use(n).catch(()=>null):Promise.resolve(null);
  let [db,user,assets,downloads,sample]=cl&&cl.use?await Promise.all([use('db'),use('user'),use('assets'),use('downloads'),use('sample')]):[null,null,null,null,null];
  if((!cl||!cl.use)&&window.supabase&&window.supabase.createClient){
    S.mode='supa';S.maxVidMB=50;
    try{const L=await startSupa();if(!L)return;db=L.db;assets=L.assets;downloads=L.downloads;S.uid=L.uid;}
    catch(e){console.error(e);gate('<h1>'+LOGO+'Drill Havuzu</h1><div class="err">'+esc(trErr(e.message))+'</div><button class="btn primary" onclick="location.reload()">Tekrar dene</button>');return;}
  }
  else if(!cl||!cl.use){
    if(document.querySelector('script[data-supa]')){gate('<h1>'+LOGO+'Drill Havuzu</h1><div class="err">Sunucuya bağlanılamadı. Uygulama internet bağlantısı ister; bağlantını kontrol edip tekrar dene.</div><button class="btn primary" onclick="location.reload()">Tekrar dene</button>');return;}
    try{const L=await makeLocal();S.local=true;db=L.db;assets=L.assets;downloads=L.downloads;S.backup=L.backup;S.uid='local';$('#bkBtn').hidden=false;}catch(e){console.error(e);}
  }
  S.db=db;S.assets=assets;S.downloads=downloads;S.sample=sample;$('#aiBtn').hidden=!sample;
  if(user){try{S.uid=await user.id();}catch(e){}try{const c=await user.can('data.write');if(c===false)S.canWrite=false;}catch(e){}}
  if(!S.uid){try{S.uid=localStorage.getItem('dh_uid');if(!S.uid){S.uid='anon-'+Math.random().toString(36).slice(2,10);localStorage.setItem('dh_uid',S.uid);}}catch(e){S.uid='anon';}}
  $('#newBtn').hidden=!S.canWrite;
  if(!db){S.loaded=true;render();return;}
  db.collection('drills').onSnapshot(snap=>{
    const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data()));S.drills=m;S.loaded=true;render();
  },err=>{S.loaded=true;render();toast('Drill\'ler yüklenemedi');});
  db.collection('weeks').onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data()));S.weeks=m;if(S.view!=='plan')renderPool();},()=>{});
  subWeek();
})();
})();
</script>
